# fly.toml app configuration file generated for ch-ow on 2026-10-02T00:26:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ch-ow'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Une seule machine toujours allumée : ni démarrage à froid (~4 s), ni requête envoyée à une machine en cours d'arrêt.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
